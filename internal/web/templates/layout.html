{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jellybird</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background:#0f1115; color:#e2e6ee; }
  header { display:flex; align-items:center; gap:1rem; padding:.8rem 1.2rem;
           background:#151923; border-bottom:1px solid #262c3a; }
  header h1 { margin:0; font-size:1.1rem; color:#8fb4ff; }
  nav a { color:#9aa3b5; text-decoration:none; margin-right:1rem; font-size:.95rem; }
  nav a.active, nav a:hover { color:#8fb4ff; }
  main { max-width:1100px; margin:0 auto; padding:1.2rem; }
  .card { background:#151923; border:1px solid #262c3a; border-radius:10px;
          padding:1rem 1.2rem; margin-bottom:1rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
  input, select, button { font:inherit; }
  input[type=text], input[type=search], input[type=password] { background:#0f1115; color:#e2e6ee;
      border:1px solid #2c3446; border-radius:8px; padding:.55rem .8rem; width:100%; }
  button { background:#2b5fd9; color:#fff; border:0; border-radius:8px;
           padding:.55rem 1.1rem; cursor:pointer; }
  button.ghost { background:#232a3a; }
  a.ghostlink { display:inline-block; background:#232a3a; color:#fff; border-radius:8px;
                padding:.55rem 1.1rem; text-decoration:none; }
  a.ghostlink:hover { background:#2c3446; }
  .sm, button.sm, a.ghostlink.sm { padding:.25rem .6rem; font-size:.8rem; border-radius:6px; }
  td.localcell, td.actions { white-space:nowrap; }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:.45rem .6rem; border-bottom:1px solid #232838; }
  th { color:#9aa3b5; font-weight:600; }
  @media (max-width: 640px) {
    main { padding:.8rem; }
    table { display:block; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; }
  }
  .pill { display:inline-block; padding:.1rem .55rem; border-radius:99px; font-size:.75rem; }
  .pill.ok { background:#12351f; color:#6fe08f; }
  .pill.warn { background:#3a2d10; color:#ffc861; }
  .pill.err { background:#3a1616; color:#ff7a7a; }
  .pill.blue { background:#14243d; color:#8fb4ff; }
  .muted { color:#9aa3b5; }
  .trunc { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .err { color:#ff7a7a; min-height:1.2rem; }
  .media { background:#151923; border:1px solid #262c3a; border-radius:10px;
           padding:.8rem; cursor:pointer; }
  .media:hover { border-color:#2b5fd9; }
  .media img { width:100%; border-radius:6px; aspect-ratio:2/3; object-fit:cover; background:#0f1115; }
  .media .t { font-size:.9rem; margin-top:.4rem; }
  dialog { background:#151923; color:#e2e6ee; border:1px solid #262c3a;
           border-radius:12px; max-width:900px; width:92vw;
           max-height:85vh; overflow-y:auto; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  @media (max-width: 640px) {
    dialog { width:96vw; max-height:90vh; padding:.8rem; }
  }
  .streambtn { background:#12351f; }
  code { background:#0f1115; padding:.1rem .35rem; border-radius:5px; }
</style>
</head>
<body>
<header>
  <h1>🐦 jellybird</h1>
  {{if .User}}
  <nav>
    <a href="/" data-page="home">Library</a>
    <a href="/search" data-page="search">Search &amp; Add</a>
    <a href="/cloud" data-page="cloud">Cloud</a>
    <a href="/local" data-page="local">Local files</a>
    <a href="/settings" data-page="settings">Settings</a>
  </nav>
  <span class="muted" style="margin-left:auto" id="syncinfo"></span>
  <form method="post" action="/logout" class="row" style="gap:.5rem">
    <span class="muted">{{.User}}</span>
    <button type="submit" class="ghost">Log out</button>
  </form>
  {{end}}
</header>
<main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
// esc HTML-escapes a value before it is interpolated into innerHTML.
// Torrent names, TMDB titles, provider errors etc. are untrusted input:
// ALWAYS wrap them in esc() inside template literals.
function esc(v) {
  return String(v ?? "").replace(/[&<>"'`]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));
}
async function api(path, opts) {
  const r = await fetch(path, Object.assign({credentials: "same-origin"}, opts));
  if (r.status === 401) {
    location.href = "/login?next=" + encodeURIComponent(location.pathname + location.search);
    throw new Error("session expired");
  }
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.statusText);
  return r.json();
}
function pill(text, cls) { return `<span class="pill ${esc(cls)}">${esc(text)}</span>`; }
function fmtSize(n) {
  if (!n) return "—";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (n >= 1024 && i < u.length-1) { n /= 1024; i++; }
  return n.toFixed(i > 1 ? 1 : 0) + " " + u[i];
}

// --- local copies ("keep local" + save to device), shared by Library and
// Local files. onChange re-renders after a button changes something.
const lkey = (p, t, f) => `${p}/${t}/${f}`;
const localQS = (p, t, f) => new URLSearchParams({provider: p, torrent_id: t, file_id: f});
const saveURL = (p, t, f) => `/api/download/${encodeURIComponent(p)}/${encodeURIComponent(t)}/${encodeURIComponent(f)}`;
const LOCAL_RM_CONFIRM = "Delete the local copy from the server? If it's still in your debrid cloud it goes back to streaming.";

function localStatus(lf) {
  if (!lf) return "";
  switch (lf.status) {
    case "done": return pill("local ✓", "ok");
    case "queued": return pill("queued", "blue");
    case "downloading":
    case "moving": {
      const pct = lf.size_bytes ? Math.floor(lf.bytes_done * 100 / lf.size_bytes) : 0;
      return pill(`${lf.status === "moving" ? "moving " : ""}${pct}%`, "warn");
    }
    case "failed": return `<span title="${esc(lf.error)}">${pill("failed", "err")}</span>`;
  }
  return "";
}

function localActions(p, t, f, lf) {
  const d = `data-provider="${esc(p)}" data-torrent-id="${esc(t)}" data-file-id="${esc(f)}"`;
  const save = `<a class="ghostlink sm" href="${esc(saveURL(p, t, f))}" title="Download this file to this device">Save</a>`;
  if (!lf) return `<button class="ghost sm localadd" ${d} title="Download to the server for offline playback">Keep local</button> ${save}`;
  if (lf.status === "failed") return `<button class="ghost sm localadd" ${d}>Retry</button> <button class="ghost sm localrm" ${d} title="Forget">✕</button>`;
  const rm = `<button class="ghost sm localrm" ${d} data-confirm="${lf.in_library === false ? "only" : "1"}" title="Delete the local file; the title goes back to streaming">Remove local</button>`;
  const move = lf.move_to ? `<button class="ghost sm localmv" ${d} title="Move to ${esc(lf.move_to)}">Move</button> ` : "";
  if (lf.status === "done" || lf.status === "moving") return `${move}${rm} ${save}`;
  return `<button class="ghost sm localrm" ${d} title="Cancel download">Cancel</button>`;
}

function wireLocalButtons(root, onChange) {
  $$("button.localadd", root).forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      await api("/api/local", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({provider: b.dataset.provider, torrent_id: b.dataset.torrentId, file_id: b.dataset.fileId})});
    } catch (e) { alert(e.message); }
    onChange();
  });
  $$("button.localmv", root).forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      await api("/api/local/move", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({provider: b.dataset.provider, torrent_id: b.dataset.torrentId, file_id: b.dataset.fileId})});
    } catch (e) { alert(e.message); }
    onChange();
  });
  $$("button.localrm", root).forEach(b => b.onclick = async () => {
    const msg = b.dataset.confirm === "only"
      ? "This is the ONLY copy left — the title is gone from your debrid cloud. Delete it from the server for good?"
      : LOCAL_RM_CONFIRM;
    if (b.dataset.confirm && !confirm(msg)) return;
    b.disabled = true;
    try { await api("/api/local?" + localQS(b.dataset.provider, b.dataset.torrentId, b.dataset.fileId), {method:"DELETE"}); }
    catch (e) { alert(e.message); }
    onChange();
  });
}
</script>
{{end}}

{{define "foot"}}
</main>
</body>
</html>
{{end}}
