{{template "head" .}}
<div class="card">
  <div class="row">
    <input type="search" id="q" placeholder="Search movies & shows… (needs TMDB key)" autofocus>
    <button id="searchbtn">Search</button>
  </div>
  <div class="err" id="err"></div>
  <div class="grid" id="results" style="margin-top:1rem"></div>
</div>

<dialog id="dlg">
  <div class="row" style="justify-content:space-between; margin-bottom:.6rem">
    <strong id="dlg-title"></strong>
    <button class="ghost" onclick="dlg.close()">✕</button>
  </div>
  <div id="dlg-body"><p class="muted">Loading streams…</p></div>
</dialog>

<script>
let token = new URLSearchParams(location.search).get("token") || "";
function q(extra="") { return token ? `?token=${token}${extra ? "&"+extra : ""}` : (extra ? "?"+extra : ""); }

$("#searchbtn").onclick = doSearch;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

async function doSearch() {
  $("#err").textContent = ""; $("#results").innerHTML = "";
  const query = $("#q").value.trim();
  if (!query) return;
  try {
    // API fields are lowercase: id, title, name, media_type, poster_path,
    // release_date (movies) / first_air_date (tv).
    const results = await api("/api/search" + q("q=") + encodeURIComponent(query));
    if (!results.length) { $("#err").textContent = "No results."; return; }
    for (const r of results) {
      const title = r.title || r.name || r.original_title || r.original_name || "Unknown";
      const year = (r.first_air_date || r.release_date || "").slice(0, 4);
      const poster = r.poster_path
        ? `<img src="https://image.tmdb.org/t/p/w300${r.poster_path}" alt="">`
        : `<div style="aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:2.5rem">🎬</div>`;
      const el = document.createElement("div");
      el.className = "media";
      el.innerHTML = `
        ${poster}
        <div class="t">${title}${year ? " ("+year+")" : ""}</div>
        <div class="muted">${r.media_type === "tv" ? "TV series" : "Movie"}</div>`;
      el.onclick = () => openStreams(r, title);
      $("#results").appendChild(el);
    }
  } catch (e) { $("#err").textContent = e.message; }
}

async function openStreams(r, title) {
  const mediaType = r.media_type, tmdbID = r.id;
  const year = (r.first_air_date || r.release_date || "").slice(0, 4);
  $("#dlg-title").textContent = title;
  dlg.showModal();
  if (mediaType === "tv") {
    await showSeasons(tmdbID, title);
  } else {
    await loadTorrents(mediaType, tmdbID, title, year, 1, 1);
  }
}

async function showSeasons(tmdbID, title) {
  $("#dlg-body").innerHTML = `<p class="muted">Loading seasons…</p>`;
  try {
    const seasons = await api(`/api/tv/seasons${q(`tmdb_id=${tmdbID}`)}`);
    if (!seasons.length) { $("#dlg-body").innerHTML = `<p class="muted">No seasons found.</p>`; return; }
    $("#dlg-body").innerHTML = `<div class="grid">${seasons.map(s => `
      <div class="media" data-season="${s.season_number}">
        ${s.poster_path
          ? `<img src="https://image.tmdb.org/t/p/w300${s.poster_path}" alt="">`
          : `<div style="aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:2.5rem">📺</div>`}
        <div class="t">${s.name || "Season " + s.season_number}</div>
        <div class="muted">${s.episode_count} episodes</div>
      </div>`).join("")}</div>`;
    $$("#dlg-body [data-season]").forEach(el => {
      const season = seasons.find(s => s.season_number === +el.dataset.season);
      el.onclick = () => showEpisodes(tmdbID, title, season);
    });
  } catch (e) { $("#dlg-body").innerHTML = `<p class="err">${e.message}</p>`; }
}

async function showEpisodes(tmdbID, title, season) {
  $("#dlg-body").innerHTML = `<p class="muted">Loading episodes…</p>`;
  try {
    const episodes = await api(`/api/tv/episodes${q(`tmdb_id=${tmdbID}&season=${season.season_number}`)}`);
    const back = `<button class="ghost" id="backtoseasons">‹ Seasons</button>`;
    if (!episodes.length) { $("#dlg-body").innerHTML = `${back}<p class="muted">No episodes found.</p>`; return; }
    const rows = episodes.map(e => `
      <tr class="ep" data-ep="${e.episode_number}" style="cursor:pointer">
        <td>${e.episode_number}</td>
        <td>${e.name || "Episode " + e.episode_number}</td>
        <td class="muted">${e.air_date || ""}</td>
      </tr>`).join("");
    $("#dlg-body").innerHTML = `
      <div class="row" style="justify-content:space-between; margin-bottom:.6rem">
        ${back}<strong>${season.name || "Season " + season.season_number}</strong>
      </div>
      <table><thead><tr><th>#</th><th>Episode</th><th>Aired</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    $("#backtoseasons").onclick = () => showSeasons(tmdbID, title);
    $$("#dlg-body tr.ep").forEach(tr => {
      tr.onclick = () => loadTorrents("tv", tmdbID, title, "", season.season_number, +tr.dataset.ep);
    });
  } catch (e) { $("#dlg-body").innerHTML = `<p class="err">${e.message}</p>`; }
}

async function loadTorrents(mediaType, tmdbID, title, year, season, episode) {
  $("#dlg-body").innerHTML = `<p class="muted">Searching indexers & debrid caches…</p>`;
  try {
    // Fields: title, size_bytes, seeders, source, provider, hash, cached.
    const streams = await api(`/api/torrents${q(`type=${mediaType}&tmdb_id=${tmdbID}&season=${season}&episode=${episode}`)}`);
    if (!streams.length) { $("#dlg-body").innerHTML = `<p class="muted">No torrents found.</p>`; return; }
    const rows = streams.slice(0, 50).map((s, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${s.title}</td>
        <td class="muted">${fmtSize(s.size_bytes)}</td>
        <td class="muted">${s.seeders} seed</td>
        <td>${s.cached ? pill(s.provider || "cached","ok") : pill("not cached","warn")}</td>
        <td><button class="streambtn" data-i="${i}">Add</button></td>
      </tr>`).join("");
    $("#dlg-body").innerHTML = `<table><thead>
      <tr><th>#</th><th>Release</th><th>Size</th><th>Seeds</th><th>Debrid</th><th></th></tr>
      </thead><tbody>${rows}</tbody></table>
      <p class="muted">Green rows are instantly available on your debrid.</p>`;
    $$("#dlg-body button.streambtn").forEach(btn => {
      btn.onclick = async () => {
        const s = streams[+btn.dataset.i];
        btn.disabled = true; btn.textContent = "…";
        try {
          const res = await api("/api/add"+q(), {method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
              magnet: s.magnet, info_hash: s.hash, provider: s.provider,
              title, media_type: mediaType, year: year ? +year : 0,
              season: mediaType === "tv" ? season : 0,
              episode: mediaType === "tv" ? episode : 0,
            })});
          btn.textContent = "✓ added";
          if (res.cached && res.synced) {
            btn.textContent = "✓ added (cached)";
            setTimeout(()=>{dlg.close(); location.href = "/"+q(); }, 1200);
          } else if (res.cached) {
            btn.textContent = "✓ added — sync pending";
          }
        } catch (e) { btn.textContent = "retry"; alert(e.message); btn.disabled = false; }
      };
    });
  } catch (e) { $("#dlg-body").innerHTML = `<p class="err">${e.message}</p>`; }
}
</script>
{{template "foot" .}}
