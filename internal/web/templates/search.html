{{template "head" .}}
<div class="card">
  <div class="row">
    <input type="search" id="q" placeholder="Search movies & shows… (needs TMDB key)" autofocus>
    <button id="searchbtn">Search</button>
  </div>
  <div class="err" id="err"></div>
  <div class="grid" id="results" style="margin-top:1rem"></div>
</div>

{{template "addflow" .}}
<script>
$("#searchbtn").onclick = doSearch;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

async function doSearch() {
  $("#err").textContent = ""; $("#results").innerHTML = "";
  const query = $("#q").value.trim();
  if (!query) return;
  try {
    // API fields are lowercase: id, title, name, media_type, poster_path,
    // release_date (movies) / first_air_date (tv).
    const results = await api("/api/search" + q({q: query}));
    if (!results.length) { $("#err").textContent = "No results."; return; }
    for (const r of results) {
      const title = r.title || r.name || r.original_title || r.original_name || "Unknown";
      const year = (r.first_air_date || r.release_date || "").slice(0, 4);
      const poster = r.poster_path
        ? `<img src="https://image.tmdb.org/t/p/w300${esc(r.poster_path)}" alt="">`
        : `<div style="aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:2.5rem">🎬</div>`;
      const el = document.createElement("div");
      el.className = "media";
      el.innerHTML = `
        ${poster}
        <div class="t">${esc(title)}${year ? " ("+esc(year)+")" : ""}</div>
        <div class="muted">${r.media_type === "tv" ? "TV series" : "Movie"}</div>`;
      el.onclick = () => openStreams(r, title);
      $("#results").appendChild(el);
      // TV shows aren't checked here — "in library" only makes sense per
      // episode (or a whole season pack), which needs a season picked
      // first; see the badge added in showEpisodes() instead.
      if (r.media_type !== "tv") {
        checkExists("movie", r.id).then(exists => {
          if (!exists) return;
          const badge = document.createElement("div");
          badge.style.marginTop = ".25rem";
          badge.innerHTML = pill("In library", "ok");
          el.appendChild(badge);
        });
      }
    }
  } catch (e) { $("#err").textContent = e.message; }
}
</script>
{{template "foot" .}}
