# jellybird + Jellyfin example stack.
#
# Setup:
#   1. `cp .env.example .env`  and paste your API keys into .env
#   2. `cp config.example.yaml config.yaml` (already shipped: tweak if needed)
#   3. `docker compose up -d`

services:
  jellybird:
    build: .
    # image: ghcr.io/yourname/jellybird:latest   # once published
    container_name: jellybird
    restart: unless-stopped
    ports:
      - "8097:8097"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - media:/media
      - data:/data
      # - downloads:/downloads
    environment:
      # Base URL written into every .strm file. It must be reachable from
      # the PLAYBACK DEVICES, not just from Jellyfin: clients that direct
      # play (Roku, Android TV / Google TV) open this URL themselves. The
      # compose service name ("http://jellybird:8097") only resolves inside
      # the container network, so those clients fail to play unless they
      # use an external player. Set it in .env to this host's LAN address
      # or DNS name (e.g. http://192.168.1.50:8097), recreate the container,
      # then run "Scan All Libraries" in Jellyfin. No library wipe needed:
      # the next sync rewrites the .strm contents in place.
      JELLYBIRD_SERVER_EXTERNAL_URL: "${JELLYBIRD_SERVER_EXTERNAL_URL:-http://jellybird:8097}"
      # `${VAR:-}` defaults to empty and stays quiet when an integration is
      # off. jellybird needs at least ONE provider key; if neither is set the
      # container exits with a clear message — check `docker logs jellybird`.
      JELLYBIRD_REALDEBRID_API_KEY: "${JELLYBIRD_REALDEBRID_API_KEY:-}"
      JELLYBIRD_TORBOX_API_KEY: "${JELLYBIRD_TORBOX_API_KEY:-}"
      JELLYBIRD_TMDB_API_KEY: "${JELLYBIRD_TMDB_API_KEY:-}"
      JELLYBIRD_JELLYSEERR_URL: "${JELLYBIRD_JELLYSEERR_URL:-}"
      JELLYBIRD_JELLYSEERR_API_KEY: "${JELLYBIRD_JELLYSEERR_API_KEY:-}"
      JELLYBIRD_SERVER_TOKEN: "${JELLYBIRD_SERVER_TOKEN:-}"
      JELLYBIRD_ADMIN_USERNAME: "${JELLYBIRD_ADMIN_USERNAME:-}"
      JELLYBIRD_ADMIN_PASSWORD: "${JELLYBIRD_ADMIN_PASSWORD:-}"
      # Where "keep local" copies go; empty = inside the library.
      # JELLYBIRD_DOWNLOADS_PATH: /downloads

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - jellyfin-config:/config
      - media:/media:ro
      # Same path as in jellybird; add /downloads/Movies and
      # /downloads/Shows to your Jellyfin libraries.
      # - downloads:/downloads:ro
      # Ships the Jellybird Jellyfin plugin (built from the sibling
      # jellyfin-plugin-jellybird repo) straight into Jellyfin's plugin dir.
      - ./plugin:/config/plugins/Jellybird_1.0.0.0:z
    # Jellyfin reaches jellybird over the compose network using the
    # external_url above; no extra config needed.

  # Optional: Silo (https://siloserver.org) instead of, or next to, Jellyfin.
  # Off by default; start it with the `silo` profile:
  #   1. Set SILO_SECRET_KEY and SILO_POSTGRES_PASSWORD in .env
  #      (`openssl rand -base64 48` for each).
  #   2. `docker compose --profile silo up -d`
  #   3. Open http://<host>:8090, finish onboarding, and add /media/Movies
  #      and /media/Shows as library sources.
  # Silo reaches jellybird's .strm links over this compose network, so the
  # default external_url works for server-side playback here too.
  silo:
    image: ${SILO_IMAGE:-ghcr.io/silo-server/silo-server:latest}
    container_name: silo
    restart: unless-stopped
    profiles: [silo]
    environment:
      MODE: integrated
      PORT: "8080"
      JF_PORT: "8096"
      # Master key for Silo's at-rest secret encryption (32+ chars). Silo
      # refuses to start without it, and losing it makes stored secrets
      # unrecoverable, so back it up separately from the database.
      SECRET_KEY: "${SILO_SECRET_KEY:-}"
      DATABASE_URL: "postgres://silo:${SILO_POSTGRES_PASSWORD:-silo}@silo-postgres:5432/silo?sslmode=disable"
      REDIS_URL: redis://silo-redis:6379
      SILO_PLUGIN_CACHE_DIR: /var/lib/silo/plugins
      POSTGRES_TUNE: auto
    ports:
      - "${SILO_PORT:-8090}:8080"
      # Silo's Jellyfin-compatible API. Its usual host port 8096 is taken
      # by the jellyfin service above, so it's published on 8196 instead.
      - "${SILO_JF_PORT:-8196}:8096"
      # Audiobookshelf-compatible API.
      - "${SILO_ABS_PORT:-13378}:13378"
    volumes:
      - media:/media:ro
      - silo-plugins:/var/lib/silo/plugins
      - silo-artwork:/var/lib/silo/artwork
      - silo-compat:/var/lib/silo/compat
      - silo-transcode:/tmp/silo-transcode
      # Host stats for Silo's resource dashboard (Linux hosts).
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/stat:/host/proc/stat:ro
      - /proc/loadavg:/host/proc/loadavg:ro
    depends_on:
      silo-postgres:
        condition: service_healthy
      silo-redis:
        condition: service_healthy

  silo-postgres:
    # Silo requires PostgreSQL with the pgvector extension.
    image: pgvector/pgvector:pg18
    container_name: silo-postgres
    restart: unless-stopped
    profiles: [silo]
    shm_size: ${SILO_POSTGRES_SHM_SIZE:-8gb}
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: "${SILO_POSTGRES_PASSWORD:-silo}"
      POSTGRES_DB: silo
    volumes:
      - silo-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo"]
      interval: 5s
      timeout: 3s
      retries: 5

  silo-redis:
    image: redis:alpine
    container_name: silo-redis
    restart: unless-stopped
    profiles: [silo]
    volumes:
      - silo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  media:
  # Optional: store "keep local" downloads on a NAS (the library and .strm
  # files stay in `media`). Uncomment ONE block, the two `downloads` mounts
  # and JELLYBIRD_DOWNLOADS_PATH above, then fill in JELLYBIRD_NAS_* in .env.
  # See "Downloads on a NAS" in the README.
  # NFS:
  # downloads:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: "addr=${JELLYBIRD_NAS_HOST},nfsvers=4,rw"
  #     device: ":${JELLYBIRD_NAS_EXPORT}"
  # SMB / CIFS:
  # downloads:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     o: "username=${JELLYBIRD_NAS_USER},password=${JELLYBIRD_NAS_PASSWORD},vers=3.0,uid=0,gid=0,file_mode=0664,dir_mode=0775"
  #     device: "//${JELLYBIRD_NAS_HOST}/${JELLYBIRD_NAS_SHARE}"
  data:
  jellyfin-config:
  # Silo (only created with --profile silo)
  silo-plugins:
  silo-artwork:
  silo-compat:
  silo-transcode:
  silo-postgres:
  silo-redis:
